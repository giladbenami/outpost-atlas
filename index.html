/* ATLAS / DESIGN SYSTEM 01 — deliberately minimal */
:root{--bg:#fff;--paper:#fff;--ink:#111;--line:#d0d0d0;--muted:#666;--accent:#ff4b22;--timeline:126px}
body{font-family:Inter,Heebo,Arial,sans-serif;background:white;color:var(--ink)}
.app{grid-template-rows:51px minmax(0,1fr) var(--timeline);min-height:440px}
header{background:white;padding:0 20px;border-color:#ccc}
header .brand{font-size:13px;letter-spacing:.095em;font-weight:600}
header .subtitle{font-size:10px;margin-top:2px}
button{border-radius:0;border-color:#ccc;background:#fff;color:#111;font-size:11px;padding:7px 10px}
button.active{background:#111;color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{background:#e4e6e3}
.marker{width:11px;height:11px;border:1px solid white;background:#111;box-shadow:0 0 0 1px #fff6;cursor:pointer}
.marker.selected{width:17px;height:17px;background:var(--accent);box-shadow:0 0 0 2px white,0 0 0 3px var(--accent)}
.marker.ghost{width:7px;height:7px;background:#fff;border:1px solid #111;opacity:.35;cursor:default;box-shadow:none}
.marker.ghost:hover{transform:none}
.map-legend{top:17px;left:17px;background:#fffffff2;border:1px solid #ddd;padding:10px 12px;font-size:11px}
.map-legend b{font-size:10px}
.help{background:#fffe;border:1px solid #ddd;bottom:12px;left:16px}
.panel{width:min(480px,calc(100% - 32px));top:12px;right:12px;bottom:12px;background:#fff;border:1px solid #bbb;box-shadow:none;padding:21px 23px;transition:transform .22s}
.panel h1{font-size:27px;margin:16px 0 5px;font-weight:600;letter-spacing:-.015em}
.panel .en{font-size:12px}
.panel .eyebrow{font-family:Inter,Arial,sans-serif;letter-spacing:.12em}
.panel .close{font-size:19px}
.meta{margin:18px 0;padding:13px 0;gap:12px;border-color:#ddd}
.meta small{color:#777;font-size:10px}
.meta strong{font-size:12px;font-weight:500}
.panel .lead{font-size:15px;line-height:1.65;font-weight:600;margin:0 0 14px}
.bodytext{font-size:13px;line-height:1.85;margin:0 0 16px}
.subhead{font-size:10px;text-transform:uppercase;color:#666;letter-spacing:.08em}
.tag{font-size:10px;padding:5px 7px}
.related{background:#fff;border:0;border-top:1px solid #ddd;font-weight:500;padding:11px 0}
.related span{color:var(--accent)}
.source-note{font-size:10px}
.documents{border-top:1px solid #ddd;padding-top:14px;margin-top:17px}
.doc-frame{height:174px;display:grid;place-items:center;background:#f3f3f3;border:1px solid #ddd;position:relative;overflow:hidden}
.doc-graphic{width:70%;height:70%;border:1px solid #bbb;background:linear-gradient(135deg,transparent 47%,#ddd 48%,#ddd 49%,transparent 50%),repeating-linear-gradient(0deg,#fff 0px,#fff 19px,#e7e7e7 20px)}
.doc-caption{font-size:11px;color:#555;margin-top:7px}
.doc-controls{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px}
.doc-controls button{border:1px solid #ccc;padding:6px 10px}
.doc-controls span{color:#666;font:11px Inter,Arial,sans-serif}
.timeline{background:#fff;border-top:1px solid #aaa;padding:10px 21px 7px;overflow:hidden}
.timeline-top{margin:0 0 4px}
.timeline-top strong{font:600 10px Inter,Heebo,sans-serif;letter-spacing:.09em}
.timeline-top span{font-size:10px;color:#777}
.timeline-scroll{height:78px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#bbb transparent;direction:ltr}
.timeline-track{width:max(100%,1400px);height:68px;margin:0 4px;direction:ltr}
.axis{top:25px;background:#aaa}
.era{top:25px;border-color:#aaa;color:#888;font-size:9px;padding-top:7px}
.tick{top:20px;background:#aaa}
.year-label{top:49px;font:10px Inter,Arial,sans-serif;color:#777}
.event{top:19px;width:12px;height:12px;border:1px solid white;background:#333;box-shadow:none}
.event.active{top:16px;width:18px;height:18px;background:var(--accent);box-shadow:none}
.current-label{top:0;color:var(--accent);font:600 10px Inter,Arial,sans-serif}
body[data-lang="en"] .panel{direction:ltr;text-align:left}
body[data-lang="en"] .en{text-align:left;direction:ltr}
body[data-lang="en"] .related{text-align:left}
body[data-lang="en"] .eyebrow{text-align:left}
.lang-toggle{min-width:60px}
@media(max-width:720px){:root{--timeline:121px}header{padding:0 9px}.app{grid-template-rows:54px minmax(0,1fr) var(--timeline)}header .brand{font-size:11px}.subtitle{font-size:9px}.actions{gap:3px!important}#search{width:92px}.panel{width:min(380px,calc(100% - 16px));top:8px;bottom:8px;right:8px;padding:17px}.panel h1{font-size:23px}.timeline{padding:8px 10px}.timeline-top span{font-size:9px}.help{display:none}}

/* ATLAS DESIGN SYSTEM 02: restrained, fixed-scale */
:root{--accent:#f13423;--timeline:90px}
html,body,button,input{font-family:'Assistant',Arial,sans-serif!important}
body{font-weight:300}
.app{grid-template-rows:45px minmax(0,1fr) var(--timeline);min-height:380px}
header{padding:0 16px}
header .brand{font-family:'Assistant',Arial,sans-serif;font-size:17px;font-weight:400;letter-spacing:.025em}
header .actions{gap:5px}
header button{font-size:12px;font-weight:300;border:none;background:transparent;padding:5px 8px}
header button.active{color:var(--accent);background:transparent;border:none}
header button:hover{color:var(--accent);border:none}
header .lang-toggle{min-width:32px}
.marker,.marker.selected,.marker.ghost{appearance:none!important;-webkit-appearance:none!important;display:block!important;flex:none!important;box-sizing:border-box!important;aspect-ratio:1/1!important;width:7px!important;height:7px!important;min-width:7px!important;min-height:7px!important;max-width:7px!important;max-height:7px!important;padding:0!important;margin:0!important;border:0!important;border-radius:50%!important;background:#111!important;box-shadow:none!important;outline:none!important;line-height:0!important;font-size:0!important;}
.marker.selected{background:var(--accent)!important}
.marker.ghost{background:#111!important;opacity:.22;pointer-events:none}

.timeline{padding:6px 19px 7px;border-top:1px solid #ccc;height:var(--timeline)}
.timeline-scroll{height:100%;overflow:hidden;direction:ltr}
.timeline-track{height:100%;width:100%;margin:0;position:relative;cursor:crosshair;touch-action:manipulation}
.timeline-track:focus-visible{outline:1px solid var(--accent)}
.timeline-track .axis{top:29px;height:1px;background:#aaa}
.timeline-track .tick{top:25px;height:9px;width:1px;background:#bbb;pointer-events:none}
.timeline-track .year-label{top:43px;font-size:11px;font-weight:200;transform:translateX(-50%);color:#555;pointer-events:none}
.timeline-track .event,.timeline-track .event.active{top:25px;width:9px;height:9px;border:0;box-shadow:none;background:var(--accent);transform:translateX(-50%);pointer-events:none}
.timeline-track .current-label{top:4px;font-size:12px;font-weight:400;color:var(--accent);pointer-events:none}
.panel{box-shadow:none}
.panel h1{font-weight:400}
.panel .lead{font-weight:600}
.meta strong{font-weight:400}
@media(max-width:720px){:root{--timeline:83px}.app{grid-template-rows:45px minmax(0,1fr) var(--timeline)}header{padding:0 9px}header .brand{font-size:15px}.timeline{padding:4px 9px}.timeline-track .year-label{font-size:9px}}
.timeline-track .year-label{white-space:nowrap}
.timeline-track .year-label:last-child{transform:translateX(-100%)}
.timeline-track .year-label{user-select:none}

/* Marker stability: MapLibre owns the wrapper transform. Never animate or override it. */
.maplibregl-marker.marker,
.maplibregl-marker.marker:hover,
.maplibregl-marker.marker.selected,
.maplibregl-marker.marker.ghost,
.maplibregl-marker.marker.ghost:hover{
  transition:none!important;
  width:26px!important;height:26px!important;
  min-width:26px!important;min-height:26px!important;
  max-width:26px!important;max-height:26px!important;
  background:transparent!important;
  border:0!important;border-radius:0!important;
  padding:0!important;box-shadow:none!important;
  appearance:none!important;-webkit-appearance:none!important;
  cursor:pointer;
}
.maplibregl-marker.marker::after{
  content:"";
  position:absolute;
  box-sizing:border-box;
  width:11px;height:11px;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border:1px solid #111;
  border-radius:50%;
  background:#111;
  pointer-events:none;
}
.maplibregl-marker.marker.selected::after{
  background:var(--accent);
  border-color:var(--accent);
}
.maplibregl-marker.marker.ghost{cursor:default;opacity:1;pointer-events:none}
.maplibregl-marker.marker.ghost::after{
  width:7px;height:7px;background:#111;border:0;opacity:.3;
}

const byId=Object.fromEntries(OBJECTS.map(o=>[o.id,o]));
const tr={he:{subtitle:'אטלס מחקרי מתפתח · אבטיפוס 02',satellite:'לוויין',streets:'מפה',legend:'בחרו אובייקט במפה או בציר הזמן. נקודות חלולות מציינות מופעים נוספים.',help:'● מקרי מחקר · ◌ מופעים נוספים',date:'תקופה / תאריך',location:'מיקום',documents:'מסמכים / תיעוד',concepts:'מושגים',related:'הצלבות / אובייקטים קשורים',note:'תוכן ומסמכים להדגמת הממשק בלבד. הפרטים יאומתו ויוחלפו בחומרי המחקר.',timeline:'TIMELINE / ציר זמן',idle:'בחרו נקודה או גללו לאורך השנים',search:'חיפוש...'},en:{subtitle:'An evolving research atlas · Prototype 02',satellite:'Satellite',streets:'Map',legend:'Select an object on the map or timeline. Hollow dots indicate additional examples.',help:'● Research cases · ◌ Other examples',date:'Period / date',location:'Location',documents:'Documents / media',concepts:'Concepts',related:'Cross-references',note:'Sample content and document placeholders. Historical details must be verified before research publication.',timeline:'TIMELINE',idle:'Select an object or scroll through the years',search:'Search...'}};
let lang='he',current=null,docIndex=0,map,mapReady=false,markers={},ghostMarkers=[];
const el=id=>document.getElementById(id);
const minYear=1880,maxYear=2030;const pct=y=>((y-minYear)/(maxYear-minYear)*100);
const local=(x)=>typeof x==='string'?x:(x?.[lang]||x?.he||'');
const styleFor=mode=>({version:8,sources:{base:{type:'raster',tiles:mode==='satellite'?['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:mode==='satellite'?'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics':'© OpenStreetMap contributors'}},layers:[{id:'base-layer',type:'raster',source:'base'}]});
try{map=new maplibregl.Map({container:'map',style:styleFor('streets'),center:[35.02,32.2],zoom:7.35,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left')}catch(e){el('error').style.display='block';console.error(e)}
function addMarkers(){if(!map)return;Object.values(markers).forEach(x=>x.remove());ghostMarkers.forEach(x=>x.remove());ghostMarkers=[];markers={};OBJECTS.forEach(o=>{const b=document.createElement('button');b.className='marker'+(current===o.id?' selected':'');b.title=local(o.name);b.setAttribute('aria-label',local(o.name));b.onclick=()=>selectObject(o.id);markers[o.id]=new maplibregl.Marker({element:b,anchor:'center'}).setLngLat(o.coords).addTo(map)});GHOSTS.forEach(g=>{const b=document.createElement('span');b.className='marker ghost';b.title=lang==='he'?'מיקום להמחשת תפוצה בלבד':'Illustrative location only';b.setAttribute('aria-hidden','true');ghostMarkers.push(new maplibregl.Marker({element:b,anchor:'center'}).setLngLat(g.coords).addTo(map))})}
function renderDocument(){const o=byId[current];if(!o)return;const d=o.docs[docIndex];el('doc-frame').replaceChildren();const graphic=document.createElement('div');graphic.className='doc-graphic';graphic.setAttribute('aria-label',local(d));el('doc-frame').append(graphic);el('doc-caption').textContent=local(d);el('doc-counter').textContent=String(docIndex+1).padStart(2,'0')+' / '+String(o.docs.length).padStart(2,'0');el('doc-prev').disabled=o.docs.length<2;el('doc-next').disabled=o.docs.length<2;}
function showLinks(o){el('links').replaceChildren();o.related.forEach(id=>{const target=byId[id];if(!target)return;const b=document.createElement('button');b.className='related';const name=document.createElement('strong');name.textContent=local(target.name);const arrow=document.createElement('span');arrow.textContent='↗';b.append(name,arrow);b.onclick=()=>selectObject(id);el('links').append(b)})}
function renderPanel(){const o=byId[current];if(!o)return;el('object-id').textContent='OBJECT / '+String(OBJECTS.indexOf(o)+1).padStart(3,'0');el('name').textContent=local(o.name);el('english').textContent=lang==='he'?o.name.en:o.name.he;el('period').textContent=local(o.date);el('location').textContent=local(o.location);el('lead').textContent=local(o.lead);el('description').textContent=local(o.description);el('tags').replaceChildren();o.tags.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;el('tags').append(s)});showLinks(o);renderDocument()}
function selectObject(id,fly=true){const o=byId[id];if(!o)return;const changed=current!==id;current=id;if(changed)docIndex=0;el('panel').classList.add('open');renderPanel();Object.keys(markers).forEach(k=>markers[k].getElement().classList.toggle('selected',k===id));renderTimeline();drawConnections();if(fly&&map)map.flyTo({center:o.coords,zoom:Math.max(map.getZoom(),8.4),duration:850,essential:true})}
function renderTimeline(){
 const track=el('timeline-track');track.querySelectorAll(':not(.axis)').forEach(x=>x.remove());
 for(let y=minYear;y<=maxYear;y+=10){const t=document.createElement('div');t.className='tick';t.style.left=pct(y)+'%';track.append(t);const l=document.createElement('div');l.className='year-label';l.style.left=pct(y)+'%';l.textContent=y;track.append(l)}
 if(current){const o=byId[current];const m=document.createElement('div');m.className='event active';m.style.left=pct(o.year)+'%';track.append(m);const l=document.createElement('div');l.className='current-label';l.style.left=pct(o.year)+'%';l.textContent=o.year;track.append(l)}
}
function selectFromTimeline(e){const r=el('timeline-track').getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const year=minYear+x*(maxYear-minYear);const nearest=OBJECTS.reduce((best,o)=>Math.abs(o.year-year)<Math.abs(best.year-year)?o:best,OBJECTS[0]);selectObject(nearest.id)}
el('timeline-track').addEventListener('click',selectFromTimeline);
el('timeline-track').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End','Enter',' '].includes(e.key))return;e.preventDefault();const ordered=[...OBJECTS].sort((a,b)=>a.year-b.year);let i=ordered.findIndex(o=>o.id===current);if(e.key==='Home')i=0;else if(e.key==='End')i=ordered.length-1;else if(e.key==='ArrowLeft')i=Math.max(0,i<0?0:i-1);else if(e.key==='ArrowRight')i=Math.min(ordered.length-1,i<0?0:i+1);else if(i<0)i=0;selectObject(ordered[i].id)});
function drawConnections(){if(!map||!mapReady)return;const o=byId[current];const data={type:'FeatureCollection',features:o?o.related.filter(id=>byId[id]).map(id=>({type:'Feature',geometry:{type:'LineString',coordinates:[o.coords,byId[id].coords]},properties:{}})):[]};if(map.getSource('connections'))map.getSource('connections').setData(data);else{map.addSource('connections',{type:'geojson',data});map.addLayer({id:'connection-lines',type:'line',source:'connections',paint:{'line-color':'#ff4b22','line-width':1,'line-opacity':.7,'line-dasharray':[2,3]}})}}
function switchLayer(mode){if(!map)return;mapReady=false;map.setStyle(styleFor(mode));el('streets').classList.toggle('active',mode==='streets');el('satellite').classList.toggle('active',mode==='satellite')}
function setLang(next){lang=next;document.body.dataset.lang=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';el('lang').textContent=lang==='he'?'EN':'עב';Object.entries(tr[lang]).forEach(([key,val])=>{document.querySelectorAll('[data-i18n="'+key+'"]').forEach(n=>n.textContent=val)});if(current)renderPanel();renderTimeline();addMarkers()}
el('lang').onclick=()=>setLang(lang==='he'?'en':'he');
el('streets').onclick=()=>switchLayer('streets');el('satellite').onclick=()=>switchLayer('satellite');
el('close').onclick=()=>{el('panel').classList.remove('open');current=null;Object.values(markers).forEach(m=>m.getElement().classList.remove('selected'));renderTimeline();drawConnections()};
el('doc-prev').onclick=()=>{if(!current)return;const n=byId[current].docs.length;docIndex=(docIndex-1+n)%n;renderDocument()};
el('doc-next').onclick=()=>{if(!current)return;const n=byId[current].docs.length;docIndex=(docIndex+1)%n;renderDocument()};

map?.on('style.load',()=>{mapReady=true;addMarkers();drawConnections()});map?.on('error',e=>console.warn('Map renderer/tile:',e.error));setLang('he');
</script>
</body>
