<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUTPOST ATLAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--ink:#111;--line:#d0d0d0;--red:#ee3826;--timeline:89px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Assistant,Arial,sans-serif;font-weight:300}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[role=button]:focus-visible{outline:1px solid var(--red);outline-offset:3px}
.app{height:100dvh;min-height:380px;display:grid;grid-template-rows:45px minmax(0,1fr) var(--timeline)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #ddd;background:white;z-index:4}
.brand{font-size:17px;letter-spacing:.025em;font-weight:400;direction:ltr}
.actions{display:flex;align-items:center;gap:9px}
.actions button{border:0;background:transparent;padding:4px 5px;font-size:12px;font-weight:300;color:#111}
.actions button.active{color:var(--red)}
main{position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;background:#d9d5ce}
.maplibregl-ctrl-attrib{font-family:Assistant,Arial,sans-serif!important;font-size:9px!important}
.maplibregl-marker.atlas-point{width:26px!important;height:26px!important;min-width:26px!important;min-height:26px!important;max-width:26px!important;max-height:26px!important;box-shadow:none!important;appearance:none!important;border:none!important;border-radius:0!important;padding:0!important;background:transparent!important;transition:none!important;cursor:pointer}
.maplibregl-marker.atlas-point::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--dot-size,10px);height:var(--dot-size,10px);background:white;border:1px solid black;border-radius:50%;pointer-events:none;box-sizing:border-box}
.maplibregl-marker.atlas-point.selected::after{background:var(--red);border-color:var(--red)}
.maplibregl-marker.atlas-point.ghost{pointer-events:none;cursor:default}
.maplibregl-marker.atlas-point.ghost::after{width:6px;height:6px;opacity:.32;background:#111;border:0}
.maplibregl-marker.atlas-point.intro-hidden{opacity:0}
.maplibregl-marker.atlas-point.intro-visible{opacity:1;transition:opacity .65s ease!important}
.timeline{height:var(--timeline);border-top:1px solid #ccc;background:white;padding:6px 20px 8px;overflow:hidden}
.timeline-track{position:relative;direction:ltr;width:100%;height:100%;cursor:crosshair;touch-action:manipulation;user-select:none}
.axis{position:absolute;left:0;right:0;top:29px;height:1px;background:#a7a7a7;pointer-events:none}
.tick{position:absolute;top:25px;height:9px;width:1px;background:#aaa;pointer-events:none}
.year-label{position:absolute;top:43px;font-size:11px;font-weight:200;color:#444;transform:translateX(-50%);pointer-events:none}
.year-label.first{transform:translateX(0)}.year-label.last{transform:translateX(-100%)}
.current-dot{position:absolute;top:24px;width:10px;height:10px;background:var(--red);border-radius:50%;transform:translateX(-50%);pointer-events:none}
.current-year{position:absolute;top:3px;transform:translateX(-50%);font-size:12px;font-weight:400;color:var(--red);pointer-events:none}
.spread{position:absolute;z-index:5;inset:18px max(22px,calc((100% - 1060px)/2));background:white;display:none;flex-direction:column;box-shadow:0 0 0 1px #c7c7c7}
.spread.open{display:flex}
.spread-top{flex:0 0 36px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dedede;padding:0 15px;direction:ltr}
.spread-index{font-size:11px;letter-spacing:.07em;font-weight:300}
.close-spread{border:0;background:transparent;font-size:22px;font-weight:200;line-height:1;padding:3px 4px}
.spread-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);direction:ltr;flex:1;min-height:0}
.spread-page{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#fff;cursor:pointer;outline-offset:-4px}
.spread-page+.spread-page{border-left:1px solid #dedede}
.spread-page:focus-visible{outline:1px solid var(--red)}
.page-inner{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.image-page{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:25px 22px 10px}
.image-page img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.image-placeholder{width:78%;height:65%;display:flex;align-items:center;justify-content:center;background:#f5f5f5;color:#999;font-size:13px}
.page-text{padding:clamp(22px,4vw,55px);overflow-y:auto;flex:1;min-height:0;direction:rtl;scrollbar-width:thin;scrollbar-color:#ddd transparent}
.page-text[dir=ltr]{direction:ltr;text-align:left}
.page-kicker{font-size:11px;letter-spacing:.055em;color:#777;margin-bottom:18px}
.page-title{font-size:clamp(24px,2.8vw,38px);line-height:1.13;font-weight:400;margin:0 0 12px}
.page-subtitle{font-size:13px;font-weight:300;color:#6a6a6a;margin:0 0 25px}
.page-lead{font-size:clamp(16px,1.5vw,21px);line-height:1.55;font-weight:400;margin:0 0 20px}
.page-copy{font-size:clamp(13px,1.08vw,16px);line-height:1.85;margin:0 0 15px}
.page-meta{font-size:12px;color:#777;line-height:1.8}
.page-related{margin-top:30px;padding-top:13px;border-top:1px solid #ddd}
.related-link{border:0;background:none;text-align:inherit;display:block;color:var(--ink);padding:8px 0;font-size:13px;font-weight:300}
.related-link:hover{color:var(--red)}
.page-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 16px 12px;min-height:39px;font-size:11px;color:#777;font-weight:300;direction:ltr}
.page-foot a{color:#777;text-decoration:none}.page-foot a:hover{text-decoration:underline}
.page-foot .count{white-space:nowrap;font-variant-numeric:tabular-nums}
.error{display:none;position:absolute;z-index:10;bottom:12px;left:12px;background:white;padding:12px}
@media(max-width:650px){
:root{--timeline:82px}
.app{grid-template-rows:45px minmax(0,1fr) var(--timeline)}
.brand{font-size:15px}
.timeline{padding:5px 10px}
.year-label{font-size:9px}
.spread{inset:8px 8px 8px 8px}
.spread-top{flex-basis:30px}
.spread-grid{grid-template-columns:1fr 1fr}
.image-page{padding:8px}
.page-text{padding:14px}
.page-title{font-size:20px}
.page-lead{font-size:14px}
.page-copy{font-size:12px}
.page-foot{padding:6px;font-size:9px}
}
@media(prefers-reduced-motion:reduce){.maplibregl-marker.atlas-point.intro-visible{transition:none!important}}

/* ATLAS V05 — open map + editorial dossier */
#map,.maplibregl-canvas-container,.maplibregl-canvas{cursor:crosshair!important}
.maplibregl-marker.atlas-point,.maplibregl-marker.atlas-point:hover{cursor:crosshair!important}
.spread{
 inset:0 0 0 auto; width:58%; max-width:none; box-shadow:none; border-left:1px solid #bbb;
 background:#fff; display:none; flex-direction:column; overflow:auto; scrollbar-width:thin;
 scrollbar-color:#ddd transparent;direction:ltr
}
.spread.open{display:block}
.spread-top{height:41px;border:0;padding:0 20px;position:sticky;top:0;z-index:3;background:white}
.spread-index{font-size:10px}
.spread-grid{height:clamp(320px,53vh,620px); min-height:320px;display:grid;grid-template-columns:1fr 1fr;direction:ltr}
.spread-page{min-height:0;cursor:crosshair}
.spread-page+.spread-page{border:0}
.image-page{padding:16px 10px 0}
.image-page img{max-width:100%;max-height:100%;object-fit:contain}
.page-foot{padding:5px 10px 12px;min-height:28px;font-size:10px}
.page-text{overflow:auto;padding:20px}
.dossier-article{display:grid;grid-template-columns:1fr 1fr;gap:38px;padding:25px 26px 55px;direction:ltr;font-size:13px;line-height:1.72}
.dossier-article[dir=rtl]{direction:rtl}
.dossier-copy{font-weight:300}
.dossier-name{font-size:18px;font-weight:400;line-height:1.2;margin:0 0 3px}
.dossier-place{font-size:11px;margin:0 0 17px;color:#555}
.dossier-lead{font-weight:400;margin:0 0 16px;font-size:14px;line-height:1.5}
.dossier-body{margin:0 0 12px}
.dossier-meta{display:grid;grid-template-columns:80px 1fr;gap:3px 10px;font-size:12px;align-content:start}
.dossier-meta dt{font-weight:300;color:#777}
.dossier-meta dd{margin:0;font-weight:300}
.dossier-links{margin-top:18px}
.dossier-links button{border:0;background:transparent;padding:3px 0;display:block;font-family:inherit;text-align:inherit;font-size:12px;color:#111}
.dossier-links button:hover{color:var(--red)}
.doc-sheet{width:84%;height:80%;border:1px solid #ccc;padding:10%;background:#fff;display:flex;flex-direction:column;gap:11px;justify-content:center}
.doc-rule{height:1px;background:#ddd}
.doc-line{height:5px;background:#ddd}
.doc-line.short{width:58%}
.doc-text{font-size:12px;line-height:1.45;color:#444;text-align:start}
@media(max-width:850px){.spread{width:70%}.dossier-article{gap:20px;padding:20px 18px 45px}.spread-grid{height:clamp(300px,45vh,450px)}}
@media(max-width:600px){.spread{width:92%}.spread-grid{height:330px;min-height:330px}.dossier-article{grid-template-columns:1fr;padding:18px}.image-page{padding:9px 5px}.page-foot{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">OUTPOST ATLAS</div><div class="actions"><button id="lang" aria-label="Switch language">EN</button><button id="satellite" class="active">לוויין</button><button id="streets">מפה</button><button id="historic">1940</button></div></header>
<main>
<div id="map"></div>
<section class="spread" id="spread" aria-label="Object dossier" aria-hidden="true">
 <div class="spread-top"><span class="spread-index" id="spread-id">OBJECT / 001</span><button class="close-spread" id="close-spread" aria-label="Close dossier">×</button></div>
 <div class="spread-grid">
  <div class="spread-page" id="page-left" role="button" tabindex="0" aria-label="Turn left page"><div class="page-inner"></div><div class="page-foot"></div></div>
  <div class="spread-page" id="page-right" role="button" tabindex="0" aria-label="Turn right page"><div class="page-inner"></div><div class="page-foot"></div></div>
 </div>
 <article class="dossier-article" id="dossier-article" dir="rtl"></article>
</section>
<div class="error" id="error">Map could not be loaded.</div>
</main>
<div class="timeline"><div class="timeline-track" id="timeline-track" role="slider" tabindex="0" aria-label="Timeline: select nearest object by year"><div class="axis"></div></div></div>
</div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.mjs';
// The three objects below are demonstration content, NOT finished research entries.
// Illustrative ghost coordinates must be replaced with verified locations.
const fileUrl=name=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(name)+'?width=1250';
const filePage=name=>'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(name.replaceAll(' ','_'));
const OBJECTS=[
{id:'acre',year:1900,coords:[35.0708,32.9237],name:{he:'מצודת עכו',en:'Acre Citadel'},place:{he:'עכו',en:'Acre'},period:{he:'התקופה העות׳מאנית · תאריך מייצג',en:'Ottoman period · representative date'},lead:{he:'אחיזה בקרקע אינה מתחילה תמיד בבניית מבנה חדש. לפעמים היא מתחילה בירושה שלו.',en:'Territorial control is not always built anew. Sometimes it is inherited.'},body:{he:'המצודה בעכו מדגימה כיצד מערך בנוי עובר בין שלטונות ומשנה את תפקידיו. שינויים בשימוש, במוסדות ובגישה אל המבנה יוצרים שכבות של כוח וזיכרון על אותו אובייקט אדריכלי.',en:'The citadel at Acre offers a way to study how an existing fortified structure is repeatedly appropriated by institutions. Changing uses and access produce different layers of control and memory within the same architectural object.'},analysis:{he:'במקרה הזה אני בוחן שימוש חוזר כפעולה טריטוריאלית: מה ממשיך להתקיים במבנה כאשר השלטון משתנה? מה נותר מהתכנון המקורי, ומה מתווסף בכל תקופה?',en:'Here, reuse can be understood as a territorial act: what persists when sovereignty changes, and what is added or erased by each succeeding institution?'},related:['latrun','castel'],images:[{file:'Akko Citadel, Israel (16036166478).jpg',credit:'Wikimedia Commons · yeowatzup'},{file:'Acre Citadel. Acre, Old City (SRF 5; 284).jpg',credit:'Wikimedia Commons · IAA archive'}]},
{id:'latrun',year:1941,coords:[34.97966,31.83766],name:{he:'משטרת לטרון',en:'Latrun Police Fort'},place:{he:'לטרון',en:'Latrun'},period:{he:'המנדט הבריטי · 1941',en:'British Mandate · 1941'},lead:{he:'תחנה אחת ברשת של מצודות משטרה: אובייקט יחיד שמייצג מערכת של שליטה בדרכים.',en:'One police fort within a network: a single building standing for a system of road control.'},body:{he:'משטרת לטרון הוקמה בימי המנדט הבריטי כחלק ממערך תחנות משטרה מבוצרות. מיקומה לצד הדרך לירושלים מאפשר לשאול כיצד צומת תנועה הופך לנקודת בקרה ואיך מבנה אחד פועל כחלק מרשת.',en:'The Latrun police fort was built under the British Mandate as part of a network of fortified police stations. Its position along the Jerusalem road offers a case study in how movement corridors become systems of observation and control.'},analysis:{he:'הטיפולוגיה חוזרת במקומות רבים, אבל כאן הקשר בין דרך, מגדל, חומה ושינוי שימוש היסטורי ניכר במיוחד. מדוע לבחור נציגה אחת של משפחה שלמה?',en:'A repeated type appears across the landscape, but Latrun makes the relation between road, tower, perimeter and later reuse particularly visible. Why select one case to stand for a whole family?'},related:['acre','castel'],images:[{file:'The Tegart police fort at Latrun.jpg',credit:'Wikimedia Commons · Guy Wilson'},{file:'Latrun-Police-Building.jpg',credit:'Wikimedia Commons · Bukvoed'}]},
{id:'castel',year:1948,coords:[35.1433,31.7956],name:{he:'הקסטל',en:'Al-Qastal / Castel'},place:{he:'הרי ירושלים',en:'Jerusalem hills'},period:{he:'מלחמת 1948',en:'1948 war'},lead:{he:'כפר וגבעה הופכים למשלט: השליטה מתהווה מתוך טופוגרפיה ובינוי קיים.',en:'A village and hill become a strongpoint: control emerges from terrain and existing fabric.'},body:{he:'הקסטל, אל-קסטל, היה כפר פלסטיני על גבעה הצופה אל הדרך לירושלים. במלחמת 1948 הפך האזור לאתר קרבות ולנקודה אסטרטגית. אפשר לקרוא דרכו כיצד מקום מיושב הופך למערך משלטים.',en:'Al-Qastal was a Palestinian village on a hill overlooking the Jerusalem road. During the 1948 war it became a strategic battleground. Its changing role allows us to study how a lived-in place becomes a military strongpoint.'},analysis:{he:'כאן המוצב אינו בהכרח מבנה שמוקם עבור תכלית צבאית. הוא פעולה של תפיסת גובה, מבט ומיקום. המקרה מערער את ההבחנה בין כפר, חורבה ומוצב.',en:'Here the outpost need not be purpose-built architecture. It is a territorial act of occupying height, visibility and position, blurring the line between village, ruin and military post.'},related:['latrun','acre'],images:[{file:'הקסטל.jpg',credit:'Wikimedia Commons · contemporary view'},{file:'Qastal.jpg',credit:'Wikimedia Commons · 1948 archival view'}]}
];
const GHOSTS=[
{coords:[35.18,32.51],family:'latrun'},{coords:[35.01,31.71],family:'latrun'},{coords:[34.88,32.12],family:'latrun'}
];
const byId=Object.fromEntries(OBJECTS.map(x=>[x.id,x]));
const el=id=>document.getElementById(id);
const ui={he:{sat:'לוויין',map:'מפה',image:'תצלום',analysis:'קריאה',selection:'מקרה מחקר',related:'הצלבות'},en:{sat:'Satellite',map:'Map',image:'Image',analysis:'Interpretation',selection:'Research case',related:'Cross-references'}};
let lang='he',current=null,markers={},ghostMarkers=[],map,mapReady=false,stage='intro';
let sideIndex={left:0,right:0};
const introStart={center:[34.3,33.6],zoom:4.15};
const introEnd={center:[32.75,30.55],zoom:5.12};
const minYear=1880,maxYear=2030,pct=y=>((y-minYear)/(maxYear-minYear)*100);
const local=v=>typeof v==='string'?v:(v?.[lang]||v?.he||'');
const styleFor=mode=>{
 const satellite=mode==='satellite', historic=mode==='historic';
 const sources={basemap:{type:'raster',tiles:satellite?['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']:['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:satellite?19:16,attribution:satellite?'© Esri, Maxar, Earthstar Geographics':'© Esri, HERE, Garmin, OpenStreetMap contributors'}};
 const layers=[{id:'basemap',type:'raster',source:'basemap'}];
 if(historic){
  sources.historic={type:'raster',tiles:['https://palopenmaps.org/tiles/pal20k-1940s/{z}/{x}/{y}.jpg'],tileSize:256,maxzoom:16,attribution:'Historical map © Survey of Palestine, via Palestine Open Maps (palopenmaps.org)'};
  layers.push({id:'historic-map',type:'raster',source:'historic',paint:{'raster-opacity':1}});
 }
 return {version:8,sources,layers};
};
try{
 map=new maplibregl.Map({container:'map',style:styleFor('satellite'),center:introStart.center,zoom:introStart.zoom,attributionControl:true,renderWorldCopies:false});
}catch(err){el('error').style.display='block';console.error(err)}
function updateDotSize(){
 if(!map)return;
 const size=Math.max(6,Math.min(11,6+(map.getZoom()-5)*.7));
 el('map').style.setProperty('--dot-size',size.toFixed(1)+'px');
}
function addMarkers(){
 Object.values(markers).forEach(m=>m.remove());
 ghostMarkers.forEach(m=>m.remove());ghostMarkers=[];markers={};
 OBJECTS.forEach(o=>{
  const b=document.createElement('button');
  b.className='atlas-point'+(current===o.id?' selected':'')+' intro-hidden';
  b.setAttribute('aria-label',local(o.name));
  b.title=local(o.name);
  b.onclick=()=>selectObject(o.id);
  markers[o.id]=new maplibregl.Marker({element:b,anchor:'center'}).setLngLat(o.coords).addTo(map);
 });
 GHOSTS.forEach(g=>{
  const p=document.createElement('span');
  p.className='atlas-point ghost intro-hidden';
  p.setAttribute('aria-hidden','true');
  ghostMarkers.push(new maplibregl.Marker({element:p,anchor:'center'}).setLngLat(g.coords).addTo(map));
 });
}
function revealMarkers(){
 stage='ready';addMarkers();requestAnimationFrame(()=>requestAnimationFrame(()=>{
 Object.values(markers).forEach(m=>m.getElement().classList.replace('intro-hidden','intro-visible'));
 ghostMarkers.forEach(m=>m.getElement().classList.replace('intro-hidden','intro-visible'));
 }));
}
function beginIntro(){
 const skip=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(skip){map.jumpTo(introEnd);revealMarkers();return}
 map.once('moveend',revealMarkers);
 map.flyTo({center:introEnd.center,zoom:introEnd.zoom,curve:1.1,duration:2700,essential:false});
}
function renderTimeline(){
 const t=el('timeline-track');t.replaceChildren();
 const axis=document.createElement('div');axis.className='axis';t.append(axis);
 for(let y=minYear;y<=maxYear;y+=10){
  const tick=document.createElement('span');tick.className='tick';tick.style.left=pct(y)+'%';t.append(tick);
  const label=document.createElement('span');label.className='year-label'+(y===minYear?' first':'')+(y===maxYear?' last':'');label.style.left=pct(y)+'%';label.textContent=y;t.append(label);
 }
 if(current){
  const o=byId[current],dot=document.createElement('span'),year=document.createElement('span');
  dot.className='current-dot';year.className='current-year';dot.style.left=pct(o.year)+'%';year.style.left=pct(o.year)+'%';year.textContent=o.year;
  t.append(dot,year);
 }
}
function selectFromTimeline(e){
 const rect=el('timeline-track').getBoundingClientRect();
 const factor=Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
 const targetYear=minYear+factor*(maxYear-minYear);
 const nearest=OBJECTS.reduce((best,o)=>Math.abs(o.year-targetYear)<Math.abs(best.year-targetYear)?o:best,OBJECTS[0]);
 selectObject(nearest.id);
}
el('timeline-track').addEventListener('click',selectFromTimeline);
el('timeline-track').addEventListener('keydown',e=>{
 if(!['ArrowLeft','ArrowRight','Home','End','Enter',' '].includes(e.key))return;
 e.preventDefault();const arr=[...OBJECTS].sort((a,b)=>a.year-b.year);
 let i=arr.findIndex(o=>o.id===current);
 if(e.key==='Home')i=0;else if(e.key==='End')i=arr.length-1;
 else if(e.key==='ArrowLeft')i=Math.max(0,i<0?0:i-1);
 else if(e.key==='ArrowRight')i=Math.min(arr.length-1,i<0?0:i+1);
 else if(i<0)i=0;
 selectObject(arr[i].id);
});
function pagesFor(o){
 const images=o.images.map(image=>({type:'image',...image}));
 // Text is a graphic archival facsimile within the visual sequence; the main research text lives below.
 return {left:[images[0],{type:'document',kind:'plan'},images[1],{type:'document',kind:'field'}],
 right:[images[1],images[0],{type:'document',kind:'archive'},{type:'document',kind:'field'}]};
}
function renderPage(side){
 const o=byId[current];if(!o)return;
 const pages=pagesFor(o)[side],index=sideIndex[side],page=pages[index],root=el('page-'+side);
 const inside=root.querySelector('.page-inner'),foot=root.querySelector('.page-foot');inside.replaceChildren();foot.replaceChildren();
 if(page.type==='image'){
  const holder=document.createElement('div');holder.className='image-page';
  const img=document.createElement('img');img.src=fileUrl(page.file);img.alt=local(o.name);img.loading='eager';
  img.onerror=()=>{holder.replaceChildren();holder.append(makeDocument('plan',o))};
  holder.append(img);inside.append(holder);
  const source=document.createElement('a');source.href=filePage(page.file);source.target='_blank';source.rel='noopener noreferrer';source.textContent=page.credit;source.onclick=e=>e.stopPropagation();foot.append(source);
 }else{
  const holder=document.createElement('div');holder.className='image-page';holder.append(makeDocument(page.kind,o));inside.append(holder);
  const credit=document.createElement('span');credit.textContent=lang==='he'?'מסמך לדוגמה':'Sample document';foot.append(credit);
 }
 const count=document.createElement('span');count.className='count';count.textContent=String(index+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');foot.append(count);
 root.setAttribute('aria-label',(side==='left'?'Left':'Right')+' document '+(index+1)+' of '+pages.length+'. Click to browse.');
}
function makeDocument(kind,o){
 const paper=document.createElement('div');paper.className='doc-sheet';
 const name=document.createElement('div');name.className='doc-text';name.textContent=kind==='plan'?'SURVEY / PLAN':kind==='archive'?'ARCHIVAL DOCUMENT':'FIELD NOTE / 001';paper.append(name);
 const line=document.createElement('div');line.className='doc-rule';paper.append(line);
 if(kind==='field'){
  const p=document.createElement('div');p.className='doc-text';p.dir=lang==='he'?'rtl':'ltr';p.textContent=local(o.analysis);paper.append(p);
 }else{
  for(let i=0;i<5;i++){const d=document.createElement('div');d.className='doc-line'+(i===3?' short':'');paper.append(d)}
 }
 return paper;
}
function renderArticle(){
 const o=byId[current];if(!o)return;
 const root=el('dossier-article');root.replaceChildren();root.dir=lang==='he'?'rtl':'ltr';
 const copy=document.createElement('div');copy.className='dossier-copy';
 const make=(tag,cls,content,parent=copy)=>{const node=document.createElement(tag);node.className=cls;node.textContent=content;parent.append(node);return node};
 make('h2','dossier-name',local(o.name));
 make('p','dossier-place',local(o.place)+' · '+o.year);
 make('p','dossier-lead',local(o.lead));
 make('p','dossier-body',local(o.body));
 make('p','dossier-body',local(o.analysis));
 root.append(copy);
 const meta=document.createElement('div');
 const dl=document.createElement('dl');dl.className='dossier-meta';
 const fields=lang==='he'?[['שנה',String(o.year)],['תקופה',local(o.period)],['מיקום',local(o.place)],['סוג','מקרה מחקר']]:[['Year',String(o.year)],['Period',local(o.period)],['Location',local(o.place)],['Type','Research case']];
 fields.forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd)});meta.append(dl);
 const links=document.createElement('div');links.className='dossier-links';
 o.related.forEach(id=>{if(!byId[id])return;const b=document.createElement('button');b.textContent=local(byId[id].name)+' ↗';b.onclick=()=>selectObject(id);links.append(b)});meta.append(links);root.append(meta);
}
function turnPage(side){
 if(!current)return;
 const length=pagesFor(byId[current])[side].length;
 sideIndex[side]=(sideIndex[side]+1)%length;
 renderPage(side);
}
for(const side of ['left','right']){
 const root=el('page-'+side);
 root.onclick=e=>{if(e.target.closest('a,button'))return;if(window.getSelection()?.toString())return;turnPage(side)};
 root.onkeydown=e=>{if(e.target!==root)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();turnPage(side)}};
}
function renderSpread(){
 const o=byId[current];if(!o)return;
 el('spread-id').textContent='OBJECT / '+String(OBJECTS.indexOf(o)+1).padStart(3,'0');
 renderPage('left');renderPage('right');renderArticle();
}
function drawConnections(){
 if(!map||!mapReady)return;
 const o=byId[current];
 const data={type:'FeatureCollection',features:o?o.related.filter(id=>byId[id]).map(id=>({type:'Feature',geometry:{type:'LineString',coordinates:[o.coords,byId[id].coords]},properties:{}})):[]};
 if(map.getSource('connections'))map.getSource('connections').setData(data);
 else{
  map.addSource('connections',{type:'geojson',data});
  map.addLayer({id:'connections-line',type:'line',source:'connections',paint:{'line-color':'#ee3826','line-width':2,'line-opacity':.9,'line-dasharray':[2,3]}});
 }
}
function selectObject(id,fly=true){
 const o=byId[id];if(!o)return;
 if(stage!=='ready'){map.stop();revealMarkers()}
 current=id;sideIndex={left:0,right:0};
 el('spread').classList.add('open');el('spread').setAttribute('aria-hidden','false');
 renderSpread();renderTimeline();drawConnections();
 Object.keys(markers).forEach(k=>markers[k].getElement().classList.toggle('selected',k===id));
 if(fly){
  // Keep the selected location centered in the visible map area while the side dossier is open.
  const offsetX=window.innerWidth>850?-Math.round(el('map').clientWidth*.29):window.innerWidth>600?-Math.round(el('map').clientWidth*.35):0;
  map.flyTo({center:o.coords,zoom:Math.max(8.5,map.getZoom()),offset:[offsetX,0],duration:850,essential:true});
 }
}
function closeSpread(){
 el('spread').classList.remove('open');el('spread').setAttribute('aria-hidden','true');
 current=null;renderTimeline();drawConnections();
 Object.values(markers).forEach(m=>m.getElement().classList.remove('selected'));
}
el('close-spread').onclick=closeSpread;
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&current)closeSpread()});
function setLang(next){
 lang=next;document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
 el('lang').textContent=lang==='he'?'EN':'עב';
 el('satellite').textContent=ui[lang].sat;el('streets').textContent=ui[lang].map;
 if(current)renderSpread();
 Object.keys(markers).forEach(id=>{markers[id].getElement().title=local(byId[id].name);markers[id].getElement().setAttribute('aria-label',local(byId[id].name))});
}
el('lang').onclick=()=>setLang(lang==='he'?'en':'he');
function switchMap(mode){
 if(!map)return;
 mapReady=false;map.setStyle(styleFor(mode));
 el('satellite').classList.toggle('active',mode==='satellite');
 el('streets').classList.toggle('active',mode==='streets');
 el('historic').classList.toggle('active',mode==='historic');
}
el('satellite').onclick=()=>switchMap('satellite');
el('streets').onclick=()=>switchMap('streets');
el('historic').onclick=()=>switchMap('historic');
map?.on('style.load',()=>{mapReady=true;drawConnections()});
map?.on('zoom',updateDotSize);
map?.on('load',()=>{updateDotSize();beginIntro()});
map?.on('error',e=>console.warn('Map imagery:',e.error));
renderTimeline();
</script>
</body>
</html>
